[package]
name = "gyn"
version = "0.1.0"
authors = ["guillaumestpierre <113061567+guillaumestpierre@users.noreply.github.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.5", features = ["desktop", "router"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.30", features = ["bundled"] }
once_cell = "1.19.0"
dirs = "5.0.1"
chrono = { version = "0.4.34", features = ["serde"] }
plotly = "0.8"
rand = "0.8"

# Debug
dioxus-logger = "0.5.1"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
